services:
  # Database
  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=thermal_analysis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO for file storage  
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Django Backend - CHANGED PORT TO 8001
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/thermal_analysis
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - CELERY_BROKER=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - upload_temp:/tmp/uploads
    ports:
      - "8001:8000"  # CHANGED FROM 8000:8000 TO 8001:8000
    depends_on:
      - db
      - redis
      - minio
    command: python manage.py runserver 0.0.0.0:8000

  # SAM 2 GPU Worker (adapted from SAM 2's backend service)
  sam2_worker:
    build:
      context: ./sam2_worker
      dockerfile: Dockerfile
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MODEL_SIZE=base_plus
      - SAM2_BUILD_CUDA=0
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - ./sam2_worker:/app
      - sam2_cache:/root/.cache
      - upload_temp:/tmp/uploads
      - ./my_videos:/videos:ro  

    depends_on:
      - redis
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: celery -A worker.celery worker --loglevel=info --queues=sam2_queue
  # Regular Celery Worker (for non-GPU tasks)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/thermal_analysis
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - CELERY_BROKER=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - upload_temp:/tmp/uploads
    depends_on:
      - db
      - redis
      - minio
    command: celery -A thermal_analysis worker --loglevel=info --queues=default

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

volumes:
  postgres_data:
  minio_data:
  sam2_cache:
  upload_temp: